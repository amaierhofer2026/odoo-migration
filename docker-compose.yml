services:
  db:
    image: postgres:16
    container_name: odoo18-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # ACHTUNG (07.10.2026): Das Datenverzeichnis liegt im vorhandenen Volume "odoo18_pgdata".
      # Ohne "external: true" legt Compose bei abweichendem Projektnamen ein NEUES, leeres
      # Volume (z. B. odoo-test_odoo18_pgdata) an und die Testdatenbank ist scheinbar weg.
      - odoo18_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:18
    container_name: odoo18
    init: true
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./filestore:/var/lib/odoo/filestore
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

volumes:
  # Der Volume-Name ist je Umgebung verschieden (lokal "odoo18_pgdata", auf der VM
  # "odoo18_odoo18_pgdata"). Er wird deshalb aus der Umgebungsvariable PGDATA_VOLUME gelesen;
  # Standard ist der lokale Name. Auf der VM steht die Zeile in /opt/odoo18/.env (nicht im Repo).
  odoo18_pgdata:
    external: true
    name: ${PGDATA_VOLUME:-odoo18_pgdata}
