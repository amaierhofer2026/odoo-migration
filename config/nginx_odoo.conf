# Odoo 18 Reverse-Proxy - IPAX Test-VM (k001959vsx.ipax.at)
# REFERENZKOPIE (Session 76, 01.09.2026) - deployed auf der VM als
# /etc/nginx/sites-available/odoo (Symlink in sites-enabled/).
# Odoo lauscht NUR auf 127.0.0.1:8069; PostgreSQL nur Docker-intern.
# ufw: nur 22/80/443 offen. Let's-Encrypt: certbot certonly --webroot -w /var/www/certbot

# --- HTTP: ACME-Challenge + Redirect auf HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name k001959vsx.ipax.at;

    # Let's Encrypt Validierung (HTTP-01, fuer Auto-Renew)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Reverse-Proxy auf Odoo ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k001959vsx.ipax.at;

    ssl_certificate /etc/letsencrypt/live/k001959vsx.ipax.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k001959vsx.ipax.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Datei-Uploads (Odoo-Anhaenge) bis 100 MB
    client_max_body_size 100m;

    # --- Odoo Hauptroute ---
    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Odoo 18 Websocket (wird vom odoo-Server direkt auf 8069 bedient) ---
    location /websocket {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
